<meta charset="utf-8">
<!-- Grimoire - an interactive, long-lived D&D 2024 spellbook.
     Data persists across sessions via the artifact window.storage API. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --bg:#15131d; --surface:#1e1b29; --surface2:#262234; --raise:#2e293c;
    --line:#332c46; --gilt:#c9a227; --gilt-dim:#8a7220;
    --ink:#ece7f5; --ink-dim:#a79fb8; --ink-faint:#6e6683;
    --danger:#d8654f;
    /* school palette — encodes the spell's school, the app's signature system */
    --abjuration:#5b8def; --conjuration:#e0a340; --divination:#7fd4d4; --enchantment:#e56b9e;
    --evocation:#e5533c; --illusion:#a97be0; --necromancy:#6fbf73; --transmutation:#9ec24e;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(201,162,39,.06), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(169,123,224,.07), transparent 60%),
      var(--bg);
    color:var(--ink); font-family:'Inter',system-ui,sans-serif; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px; margin:0 auto; padding:28px 20px 80px}

  /* ---- Masthead ---- */
  .masthead{display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
    padding-bottom:16px; border-bottom:1px solid var(--line); margin-bottom:20px; position:relative}
  .masthead::after{content:""; position:absolute; left:0; bottom:-1px; width:120px; height:2px;
    background:linear-gradient(90deg,var(--gilt),transparent)}
  .brand .eyebrow{font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.28em;
    text-transform:uppercase; color:var(--gilt); margin:0 0 4px}
  .brand h1{font-family:'Cinzel',serif; font-weight:600; font-size:32px; letter-spacing:.04em;
    margin:0; color:var(--ink)}
  .char-wrap{position:relative; display:inline-block}
  .char-select{display:inline-flex; align-items:baseline; gap:9px; background:none; border:none; cursor:pointer; padding:0; color:var(--ink)}
  .char-name{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:31px; line-height:1; letter-spacing:.01em}
  .char-select .caret{font-family:sans-serif; font-size:13px; color:var(--ink-faint)}
  .char-select:hover .char-name{color:var(--gilt)}
  .char-select:hover .caret{color:var(--gilt)}
  .char-menu{position:absolute; top:calc(100% + 10px); left:0; z-index:50; min-width:240px; background:var(--surface2);
    border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .cm-head{font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); padding:6px 10px 4px}
  .char-item{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; background:none;
    border:none; cursor:pointer; text-align:left; padding:8px 10px; border-radius:8px; color:var(--ink-dim); font-family:inherit}
  .char-item:hover{background:var(--raise); color:var(--ink)}
  .char-item.on{color:var(--ink)}
  .char-item.on .ci-name::before{content:'✦ '; color:var(--gilt)}
  .ci-name{font-size:14px}
  .ci-count{font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-faint)}
  .cm-sep{height:1px; background:var(--line); margin:6px 4px}
  .cm-act{display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer; padding:7px 10px;
    border-radius:8px; color:var(--ink-dim); font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.03em}
  .cm-act:hover{background:var(--raise); color:var(--gilt)}
  .cm-danger:hover{color:var(--danger)}
  .modal-narrow{max-width:440px}
  .count{font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-faint); text-align:right; white-space:nowrap}
  .count b{color:var(--ink-dim); font-weight:700}

  /* ---- Toolbar ---- */
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px}
  .search{flex:1 1 240px; position:relative}
  .search input{width:100%; background:var(--surface); border:1px solid var(--line); color:var(--ink);
    border-radius:9px; padding:10px 12px 10px 34px; font-size:14px; font-family:inherit}
  .search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.5}
  select, .btn{background:var(--surface); border:1px solid var(--line); color:var(--ink-dim);
    border-radius:9px; padding:10px 12px; font-size:13px; font-family:inherit; cursor:pointer}
  select:hover,.btn:hover{border-color:var(--gilt-dim)}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--gilt)}
  .btn-add{background:linear-gradient(180deg,var(--gilt),var(--gilt-dim)); color:#1a1508;
    border:none; font-weight:600; letter-spacing:.02em}
  .btn-add:hover{filter:brightness(1.08)}
  .toggle-btn{white-space:nowrap; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.03em}
  .toggle-btn.on{background:rgba(201,162,39,.16); border-color:var(--gilt); color:var(--gilt); font-weight:700}
  .prep-count{background:none; border:none; cursor:pointer; font:inherit; color:var(--ink-faint); padding:0;
    text-decoration:underline; text-decoration-color:rgba(167,159,184,.35); text-underline-offset:2px}
  .prep-count b{color:var(--ink-dim); font-weight:700}
  .prep-count:hover{color:var(--ink-dim)}
  .prep-count.over{color:var(--danger)}
  .prep-count.over b{color:var(--danger)}

  /* ---- School filter row ---- */
  .schools{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:22px}
  .chip{font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:transparent;
    color:var(--ink-faint); cursor:pointer; transition:.12s}
  .chip:hover{color:var(--ink-dim); border-color:var(--ink-faint)}
  .chip.on{color:#12101a; font-weight:700; border-color:transparent}

  /* ---- Spell list ---- */
  .list{display:grid; gap:11px}
  .card{display:grid; grid-template-columns:6px 1fr auto; align-items:stretch;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    cursor:pointer; transition:.14s}
  .card:hover{border-color:var(--gilt-dim); transform:translateY(-1px); background:var(--surface2)}
  .spine{width:6px}
  .card-body{padding:13px 15px}
  .card-name{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:23px; line-height:1.1;
    margin:0 0 2px; letter-spacing:.01em}
  .card-name .flags{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.1em;
    vertical-align:super; margin-left:6px; opacity:.75}
  .card-meta{font-size:12.5px; color:var(--ink-dim)}
  .card-meta .sch{font-weight:600}
  .ind{display:inline-flex; align-items:center; gap:3px; font-family:'Space Mono',monospace; font-size:9px;
    letter-spacing:.08em; text-transform:uppercase; padding:1px 6px; border-radius:4px; margin-left:6px;
    vertical-align:middle; border:1px solid; line-height:1.6; white-space:nowrap}
  .ind-c{color:#8fd6d6; border-color:rgba(143,214,214,.35); background:rgba(143,214,214,.08)}
  .ind-r{color:var(--gilt); border-color:rgba(201,162,39,.35); background:rgba(201,162,39,.08)}
  .card-tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}
  .tag{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.03em; text-transform:uppercase;
    background:var(--raise); color:var(--ink-dim); border-radius:5px; padding:2px 7px}
  .card-tags{align-items:center}
  .card-tags .qtag{display:inline-flex; align-items:center; gap:5px}
  .qtag-x{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:12px; line-height:1; padding:0}
  .qtag-x:hover{color:var(--danger)}
  .qtag-add{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.03em; text-transform:uppercase;
    background:none; border:1px dashed var(--line); color:var(--ink-faint); border-radius:5px; padding:2px 8px; cursor:pointer}
  .qtag-add:hover{border-color:var(--gilt-dim); color:var(--gilt)}
  .qtag-input{background:var(--surface2); border:1px solid var(--gilt-dim); color:var(--ink); border-radius:5px;
    padding:2px 8px; font-size:11px; font-family:'Space Mono',monospace; width:118px; text-transform:uppercase}
  .qtag-input:focus{outline:none; border-color:var(--gilt)}
  .qtag-suggest{display:none; margin-top:8px; background:var(--surface2); border:1px solid var(--line);
    border-radius:8px; overflow:hidden; max-width:260px; box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .qtag-suggest.open{display:block}
  .qsug-head{font-family:'Space Mono',monospace; font-size:8.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-faint); padding:7px 11px 3px}
  .qsug-item{font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.03em;
    color:var(--ink-dim); padding:5px 11px; cursor:pointer}
  .qsug-item:hover, .qsug-item.on{background:var(--raise); color:var(--ink)}
  .qsug-item mark{background:transparent; color:var(--gilt); font-weight:700}
  .qsug-new{font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-faint); padding:7px 11px;
    border-top:1px solid var(--line)}
  .qsug-new b{color:var(--gilt); font-weight:700}
  .card-side{display:flex; align-items:center; gap:14px; padding:0 16px}
  .prep-toggles{display:flex; flex-direction:column; gap:5px}
  .prep-btn{font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.07em; text-transform:uppercase;
    border:1px solid var(--line); background:transparent; color:var(--ink-faint); border-radius:6px;
    padding:3px 0; width:72px; text-align:center; cursor:pointer; transition:.12s}
  .prep-btn:hover{border-color:var(--gilt-dim); color:var(--ink-dim)}
  .prep-btn.on{background:var(--gilt); border-color:var(--gilt); color:#1a1508; font-weight:700}
  .prep-btn.always.on{background:rgba(201,162,39,.16); border-color:var(--gilt); color:var(--gilt); font-weight:700}
  .lvl-badge{font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-faint); text-align:center; line-height:1.15}
  .lvl-badge b{display:block; font-size:19px; color:var(--ink); font-weight:700}

  .empty{text-align:center; color:var(--ink-faint); padding:60px 20px; border:1px dashed var(--line); border-radius:12px}
  .empty p{margin:0 0 4px}

  /* ---- Detail view ---- */
  .back{display:inline-flex; align-items:center; gap:7px; background:none; border:none; color:var(--ink-dim);
    font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    cursor:pointer; padding:6px 0; margin-bottom:14px}
  .back:hover{color:var(--gilt)}
  .detail{background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden}
  .detail-head{padding:26px 30px 20px; border-bottom:1px solid var(--line); position:relative}
  .detail-head::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px}
  .detail-school{font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.24em;
    text-transform:uppercase; margin:0 0 6px}
  .detail-name{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:44px; line-height:1;
    margin:0; letter-spacing:.01em}
  .detail-name .flags{font-family:'Space Mono',monospace; font-size:15px; letter-spacing:.12em;
    vertical-align:super; margin-left:9px; opacity:.8}
  .detail-sub{font-size:13.5px; color:var(--ink-dim); margin-top:8px; font-style:italic;
    font-family:'Cormorant Garamond',serif; font-size:17px}

  .detail-body{padding:24px 30px 28px}
  table.poe{border-collapse:collapse; width:100%; max-width:420px; margin:0 0 18px}
  table.poe td{border:1px solid var(--line); padding:6px 10px; font-size:13.5px; vertical-align:top}
  table.poe td.k{background:var(--surface2); font-family:'Space Mono',monospace; font-weight:700;
    color:var(--ink-dim); width:52px; text-align:center; letter-spacing:.05em}
  table.poe td.v{color:var(--ink)}
  .desc{font-size:15px; color:var(--ink); max-width:620px}
  .desc p{margin:0 0 10px}
  .desc p:last-child{margin-bottom:0}
  .desc strong{color:var(--ink); font-weight:700}
  .desc em{font-style:italic}
  .desc code{font-family:'Space Mono',monospace; font-size:.88em; background:var(--surface2); padding:1px 5px; border-radius:4px}
  .desc .md-h{font-family:'Cormorant Garamond',serif; font-weight:600; color:var(--gilt); margin:16px 0 5px; line-height:1.15}
  .desc .md-h1{font-size:21px}
  .desc .md-h2{font-size:19px}
  .desc .md-h3,.desc .md-h4{font-size:17px}
  .desc .md-ul{margin:8px 0 10px; padding-left:20px}
  .desc .md-ul li{margin:3px 0}
  .desc .md-tw{overflow-x:auto; margin:14px 0; border-radius:8px}
  .desc .md-table{border-collapse:collapse; width:100%; font-size:12.5px}
  .desc .md-table th,.desc .md-table td{border:1px solid var(--line); padding:5px 10px; text-align:left; vertical-align:top}
  .desc .md-table th{background:var(--surface2); font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink-dim); font-weight:700; white-space:nowrap}
  .desc .md-table td{color:var(--ink)}
  .desc .md-table tbody tr:hover{background:rgba(201,162,39,.05)}
  .desc-label{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--gilt); margin:0 0 6px}
  .detail-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:22px; padding-top:18px; border-top:1px solid var(--line)}
  .detail-actions{display:flex; gap:9px; margin-top:22px}
  .btn-danger{color:var(--danger); border-color:transparent; background:transparent}
  .btn-danger:hover{border-color:var(--danger)}

  /* ---- Form modal ---- */
  .scrim{position:fixed; inset:0; background:rgba(8,7,12,.72); backdrop-filter:blur(3px);
    display:flex; align-items:flex-start; justify-content:center; padding:36px 16px; overflow:auto; z-index:20}
  .modal{background:var(--surface); border:1px solid var(--line); border-radius:16px; width:100%;
    max-width:600px; padding:26px 26px 24px}
  .modal h2{font-family:'Cinzel',serif; font-weight:600; font-size:20px; letter-spacing:.03em; margin:0 0 18px}
  .field{margin-bottom:14px}
  .field label{display:block; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px}
  .field input[type=text], .field input[type=number], .field textarea, .field select{width:100%; background:var(--surface2);
    border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:9px 11px; font-size:14px; font-family:inherit}
  .field textarea{resize:vertical; min-height:70px; line-height:1.5}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px}
  .comps{display:flex; flex-wrap:wrap; gap:14px; align-items:center; font-size:13px; color:var(--ink-dim)}
  .comps label{display:inline-flex; align-items:center; gap:6px; font-family:inherit; letter-spacing:0;
    text-transform:none; font-size:13px; margin:0; cursor:pointer}
  .comps input{accent-color:var(--gilt)}
  .tagedit{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:2px}
  .tagedit .tag{cursor:default; display:inline-flex; align-items:center; gap:6px}
  .tagedit .tag button{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:13px; padding:0; line-height:1}
  .tagedit .tag button:hover{color:var(--danger)}
  .tag-input{background:var(--surface2); border:1px dashed var(--line); color:var(--ink); border-radius:5px;
    padding:2px 8px; font-size:12px; font-family:'Space Mono',monospace; width:110px}
  .rows-edit{display:grid; gap:8px}
  .row-edit{display:grid; grid-template-columns:70px 1fr 30px; gap:8px; align-items:center}
  .row-edit input{font-size:13px}
  .row-edit .rm{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:16px}
  .row-edit .rm:hover{color:var(--danger)}
  .add-row{font-family:'Space Mono',monospace; font-size:11px; color:var(--gilt); background:none;
    border:1px dashed var(--gilt-dim); border-radius:6px; padding:5px 10px; cursor:pointer; margin-top:8px; letter-spacing:.05em}
  .modal-actions{display:flex; justify-content:space-between; align-items:center; margin-top:22px; padding-top:18px; border-top:1px solid var(--line)}
  .modal-actions .right{display:flex; gap:9px}
  .btn-primary{background:linear-gradient(180deg,var(--gilt),var(--gilt-dim)); color:#1a1508; border:none; font-weight:600}
  .hint{font-size:11px; color:var(--ink-faint); margin-top:4px; font-style:italic}

  .foot{margin-top:34px; text-align:center; font-family:'Space Mono',monospace; font-size:11px;
    color:var(--ink-faint); letter-spacing:.05em}
  .foot button{background:none; border:none; color:var(--ink-faint); text-decoration:underline; cursor:pointer; font:inherit}
  .foot button:hover{color:var(--gilt)}
  .foot button.warn:hover{color:var(--danger)}
  .io-note{font-size:12.5px; color:var(--ink-dim); margin:0 0 14px; line-height:1.5}
  .io-text{width:100%; min-height:150px; max-height:300px; background:var(--surface2); border:1px solid var(--line);
    color:var(--ink); border-radius:8px; padding:10px 12px; font-family:'Space Mono',monospace; font-size:11px;
    line-height:1.5; resize:vertical; box-sizing:border-box}
  .io-text:focus{outline:none; border-color:var(--gilt)}
  .io-file{display:block; margin-bottom:12px; font-size:12px; color:var(--ink-dim); font-family:inherit}
  .io-file::file-selector-button{background:var(--surface2); border:1px solid var(--line); color:var(--ink-dim);
    border-radius:7px; padding:7px 11px; font-family:'Space Mono',monospace; font-size:11px; cursor:pointer; margin-right:10px}
  .io-file::file-selector-button:hover{border-color:var(--gilt-dim); color:var(--gilt)}
  .save-ok{color:var(--ink-faint)}
  .save-warn{color:var(--danger); text-transform:none; letter-spacing:0}
  .warn-banner{background:rgba(216,101,79,.12); border:1px solid rgba(216,101,79,.42); color:#f0b6a8;
    border-radius:10px; padding:11px 14px; font-size:12.5px; line-height:1.55; margin-bottom:16px}
  .warn-banner b{color:#f6ccc1}
  .warn-banner button{background:none; border:none; color:#f6ccc1; text-decoration:underline; cursor:pointer; font:inherit; padding:0}
  .dirty-chip{display:inline-block; margin-left:8px; font-family:'Space Mono',monospace; font-size:9px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--gilt); border:1px solid rgba(201,162,39,.45);
    background:rgba(201,162,39,.1); border-radius:999px; padding:2px 8px; vertical-align:middle}
  .foot button.dirty{color:var(--gilt); font-weight:700}
  .foot .dot{color:var(--gilt); animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){ .foot .dot{animation:none; opacity:1} }

  /* ---------- responsive ---------- */
  @media (max-width:760px){
    .wrap{padding:22px 16px 64px}
    .detail-head{padding:22px 22px 18px}
    .detail-body{padding:20px 22px 24px}
    .char-menu{max-width:calc(100vw - 32px)}
  }
  @media (max-width:560px){
    .grid2,.grid3{grid-template-columns:1fr}
    .wrap{padding:18px 13px 56px}
    /* masthead stacks so the character name and counts never collide */
    .masthead{flex-direction:column; align-items:flex-start; gap:10px}
    .count{text-align:left; white-space:normal}
    .brand h1{font-size:26px}
    .char-name{font-size:25px}
    /* toolbar: search on its own row, filters flow, add button full width */
    .search{flex-basis:100%}
    .toolbar select, .toolbar .toggle-btn{flex:1 1 auto}
    .btn-add{flex-basis:100%; text-align:center}
    /* cards: drop the redundant level badge (level is already in the meta line), tighten toggles */
    .card-body{padding:12px 13px}
    .card-name{font-size:21px}
    .lvl-badge{display:none}
    .card-side{gap:0; padding:0 12px}
    .prep-btn{width:66px; font-size:8.5px}
    /* detail + modals */
    .detail-name{font-size:32px}
    .detail-head{padding:20px 18px 16px}
    .detail-body{padding:18px 18px 22px}
    .scrim{padding:16px 10px}
    .modal{padding:20px 18px}
    table.poe{max-width:none}
  }
  @media (max-width:380px){
    .prep-btn{width:60px; letter-spacing:.03em}
    .char-name{font-size:22px}
    .schools{gap:6px}
    .chip{padding:5px 9px}
  }
</style>

<div class="wrap" id="app"><div class="empty"><p>Opening the grimoire…</p></div></div>

<script>
// Ensure correct mobile scaling whether opened standalone or in a viewer.
(function(){ try{
  if(!document.querySelector('meta[name="viewport"]')){
    const m=document.createElement('meta');
    m.name='viewport'; m.content='width=device-width, initial-scale=1, viewport-fit=cover';
    document.head.appendChild(m);
  }
}catch(_){}})();

/* ---------- storage adapter ----------
   Tries, in order: Claude's artifact storage (window.storage) → the browser's
   localStorage → in-memory. A round-trip self-test decides which actually works,
   so persistence status can be shown honestly instead of failing silently. */
let STORE_MODE='memory';   // 'claude' | 'local' | 'memory'
let PERSISTENT=false;      // true only if writes survive across sessions
const MEM={};
const hasWinStore = (typeof window!=='undefined' && window.storage
  && typeof window.storage.get==='function' && typeof window.storage.set==='function');
function lsOK(){ try{ const k='grimoire:__t'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); return true; }catch(_){ return false; } }
const Store = {
  async get(key){
    if(STORE_MODE==='claude'){ try{ const r=await window.storage.get(key); return (r && 'value' in r) ? r.value : null; }catch(_){ return null; } }
    if(STORE_MODE==='local'){ try{ return window.localStorage.getItem(key); }catch(_){ return null; } }
    return (key in MEM) ? MEM[key] : null;
  },
  async set(key,value){
    if(STORE_MODE==='claude'){ try{ await window.storage.set(key,value); return true; }catch(_){ return false; } }
    if(STORE_MODE==='local'){ try{ window.localStorage.setItem(key,value); return true; }catch(_){ return false; } }
    MEM[key]=value; return true;
  }
};
async function roundTrip(){
  try{ const t='grimoire:__selftest', stamp='ok'+Date.now(); const w=await Store.set(t,stamp); const b=await Store.get(t); return !!w && b===stamp; }
  catch(_){ return false; }
}
async function initStore(){
  STORE_MODE = hasWinStore ? 'claude' : (lsOK() ? 'local' : 'memory');
  let ok = await roundTrip();
  if(!ok && STORE_MODE==='claude'){                    // API present but not functional — fall back
    STORE_MODE = lsOK() ? 'local' : 'memory';
    ok = await roundTrip();
  }
  // memory works within a session but never survives a reload, so it is not "persistent"
  PERSISTENT = ok && STORE_MODE!=='memory';
}
function persistInfo(){
  if(PERSISTENT && STORE_MODE==='claude') return { ok:true, label:'Saved to Claude storage' };
  if(PERSISTENT && STORE_MODE==='local')  return { ok:true, label:'Saved to this browser' };
  return { ok:false, label:'Not saving between sessions' };
}

// Load library, or migrate a legacy single spellbook, or start fresh.
async function buildLibrary(){
  const libRaw = await Store.get(LKEY);
  let lib=null; try{ lib = JSON.parse(libRaw); }catch(_){ lib=null; }
  if(lib && Array.isArray(lib.characters) && lib.characters.length){
    lib.characters = lib.characters.map(normalizeCharacter);
    lib.version = 1;
    return lib;
  }
  // legacy single book?
  const legacyRaw = await Store.get(KEY);
  let legacy=null; try{ legacy = JSON.parse(legacyRaw); }catch(_){ legacy=null; }
  if(Array.isArray(legacy) && legacy.length){
    return { version:1, activeId:null, characters:[ { id:uid(), name:null, spells: legacy.map(normalizeSpell) } ] };
  }
  // brand new
  return { version:1, activeId:null, characters:[ { id:uid(), name:null, spells: seed() } ] };
}

let lastExportHash = null;
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h)+s.charCodeAt(i); h|=0; } return String(h>>>0); }
function libContent(){ syncActive(); return JSON.stringify(state.library.characters.map(c=>({name:c.name, spells:c.spells}))); }
function sbHash(){ return hashStr(libContent()); }          // hashes roster content, not active selection
function isDirty(){
  const anySpells = state.library.characters.some(c=>c.spells && c.spells.length);
  return lastExportHash===null ? anySpells : (sbHash()!==lastExportHash);
}
async function markExported(){ lastExportHash = sbHash(); await Store.set(EKEY, lastExportHash); if(state.view==='list') render(); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 's'+Date.now()+Math.random().toString(16).slice(2)); }

/* ---------- helpers ---------- */
const esc = s => (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Minimal, safe Markdown → HTML for spell notes: tables, ## headings, - lists, **bold**, *italic*, `code`.
// Input is HTML-escaped first, so only known-safe tags are ever emitted.
function mdInline(s){
  return s
    .replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*\n]+?)\*/g,'<em>$1</em>')
    .replace(/(^|[^\w])_([^_\n]+?)_(?=[^\w]|$)/g,'$1<em>$2</em>')
    .replace(/`([^`]+?)`/g,'<code>$1</code>');
}
function mdToHtml(src){
  if(!src) return '';
  const lines = String(src).replace(/\r\n?/g,'\n').split('\n');
  const isDelim = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(l);
  const isTableStart = idx => lines[idx].includes('|') && idx+1<lines.length && isDelim(lines[idx+1]);
  const splitRow = l => l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
  const out=[]; let i=0;
  while(i<lines.length){
    const line=lines[i];
    if(/^\s*$/.test(line)){ i++; continue; }
    if(isTableStart(i)){
      const header=splitRow(line); i+=2; const rows=[];
      while(i<lines.length && lines[i].includes('|') && !/^\s*$/.test(lines[i])){ rows.push(splitRow(lines[i])); i++; }
      let t='<div class="md-tw"><table class="md-table"><thead><tr>'
        + header.map(h=>`<th>${mdInline(esc(h))}</th>`).join('') + '</tr></thead><tbody>';
      t += rows.map(r=>'<tr>'+header.map((_,ci)=>`<td>${mdInline(esc(r[ci]||''))}</td>`).join('')+'</tr>').join('');
      out.push(t+'</tbody></table></div>');
      continue;
    }
    const hm=line.match(/^(#{1,4})\s+(.*)$/);
    if(hm){ out.push(`<p class="md-h md-h${hm[1].length}">${mdInline(esc(hm[2].trim()))}</p>`); i++; continue; }
    if(/^\s*[-*]\s+/.test(line)){
      const items=[];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*[-*]\s+/,'')); i++; }
      out.push('<ul class="md-ul">'+items.map(it=>`<li>${mdInline(esc(it))}</li>`).join('')+'</ul>');
      continue;
    }
    const para=[];
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4})\s+/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && !isTableStart(i)){
      para.push(lines[i]); i++;
    }
    out.push(`<p>${mdInline(esc(para.join(' ')))}</p>`);
  }
  return out.join('');
}
const lvlLabel = n => n===0 ? 'Cantrip' : 'Level '+n;
// Classify the free-text casting time into a category for filtering.
function ctCategory(ct){
  const t=(ct||'').toLowerCase();
  if(t.includes('bonus')) return 'bonus';
  if(t.includes('reaction')) return 'reaction';
  if(t.includes('action')) return 'action';
  return 'other';
}
function flagStr(sp){
  let f='';
  if(sp.comps.v) f+='V';
  if(sp.comps.s) f+='S';
  if(sp.comps.m) f+='M'+(sp.comps.cost||'');
  return f;
}
function allTags(){ return [...new Set(state.spells.flatMap(s=>s.tags||[]))].sort(); }
function buildRows(sp){
  const rows=[];
  rows.push(["CT", sp.ct + (sp.ritual?' ®':'')]);
  rows.push(["RN", sp.rn]);
  rows.push(["DU", sp.du + (sp.concentration?' ©':'')]);
  (sp.rows||[]).forEach(r=>{ if(r.k && r.v) rows.push([r.k.toUpperCase(), r.v]); });
  return rows;
}

/* ---------- filtering ---------- */
function visibleSpells(){
  const f=state.filter, q=f.q.trim().toLowerCase();
  let out = state.spells.filter(s=>{
    if(f.school && s.school!==f.school) return false;
    if(f.level!=='' && String(s.level)!==String(f.level)) return false;
    if(f.tag && !(s.tags||[]).includes(f.tag)) return false;
    if(f.prep==='prepared' && !(s.prepared||s.alwaysPrepared)) return false;
    if(f.prep==='always' && !s.alwaysPrepared) return false;
    if(f.prep==='unprepared' && (s.prepared||s.alwaysPrepared)) return false;
    if(f.ritual && !s.ritual) return false;
    if(f.cast && ctCategory(s.ct)!==f.cast) return false;
    if(q){
      const hay=(s.name+' '+s.desc+' '+(s.tags||[]).join(' ')+' '+s.school).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const by=f.sort;
  out.sort((a,b)=> by==='name' ? a.name.localeCompare(b.name)
    : by==='school' ? a.school.localeCompare(b.school)||a.level-b.level
    : (a.level-b.level)||a.name.localeCompare(b.name));
  return out;
}

}
function wireCards(){
  document.querySelectorAll('.card').forEach(c=>{
    c.onclick=()=>{ state.listScroll = window.scrollY || window.pageYOffset || 0; state.currentId=c.dataset.id; state.view='detail'; render(); };
  });
  document.querySelectorAll('.qtag-add').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); state.quickTagId=b.dataset.addtag; render();
  });
  document.querySelectorAll('[data-prep]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const sp=state.spells.find(s=>s.id===b.dataset.prep); if(!sp) return;
    sp.prepared=!sp.prepared; await persist(); render();
  });
  document.querySelectorAll('[data-always]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const sp=state.spells.find(s=>s.id===b.dataset.always); if(!sp) return;
    sp.alwaysPrepared=!sp.alwaysPrepared; await persist(); render();
  });
  document.querySelectorAll('.qtag-x').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const sp=state.spells.find(s=>s.id===b.dataset.rmtag); if(!sp) return;
    sp.tags=(sp.tags||[]).filter(t=>t!==b.dataset.tag);
    await persist(); render();
  });
  const qin=document.querySelector('.qtag-input');
  if(qin){
    const spId=qin.dataset.qtag;
    sugState={items:[],idx:-1};
    qin.onclick=e=>e.stopPropagation();
    qin.oninput=()=>{ sugState.idx=-1; renderSuggest(spId); };
    qin.onkeydown=async e=>{
      e.stopPropagation();
      const n=sugState.items.length;
      if(e.key==='ArrowDown'){ e.preventDefault(); if(n){ sugState.idx=(sugState.idx+1)%n; renderSuggest(spId,true); } }
      else if(e.key==='ArrowUp'){ e.preventDefault(); if(n){ sugState.idx=(sugState.idx<=0?n-1:sugState.idx-1); renderSuggest(spId,true); } }
      else if(e.key==='Enter'){ e.preventDefault(); qin.onblur=null;
        const pick=(sugState.idx>=0 && sugState.items[sugState.idx]) ? sugState.items[sugState.idx] : qin.value;
        await addQuickTag(spId, pick);
      }
      else if(e.key==='Escape'){
        const box=document.querySelector('.qtag-suggest');
        if(box && box.classList.contains('open')){ box.className='qtag-suggest'; box.innerHTML=''; sugState={items:[],idx:-1}; }
        else { qin.onblur=null; state.quickTagId=null; render(); }
      }
    };
    qin.onblur=async ()=>{ await addQuickTag(spId, qin.value); };
    renderSuggest(spId);
  }
}
function highlightMatch(tag, q){
  if(!q) return esc(tag);
  const i=tag.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(tag);
  return esc(tag.slice(0,i))+'<mark>'+esc(tag.slice(i,i+q.length))+'</mark>'+esc(tag.slice(i+q.length));
}
function renderSuggest(spId, keepFocus){
  const box=document.querySelector('.qtag-suggest');
  const inp=document.querySelector('.qtag-input');
  if(!box || !inp) return;
  const typed=inp.value, q=typed.trim(), ql=q.toLowerCase();
  const sp=state.spells.find(s=>s.id===spId);
  const own=new Set((sp?.tags||[]).map(t=>t.toLowerCase()));
  let items=allTags().filter(t=>!own.has(t.toLowerCase()));
  if(q){
    items=items.filter(t=>t.toLowerCase().includes(ql))
      .sort((a,b)=>((a.toLowerCase().startsWith(ql)?0:1)-(b.toLowerCase().startsWith(ql)?0:1))||a.localeCompare(b));
  }
  items=items.slice(0,6);
  sugState.items=items;
  if(sugState.idx>=items.length) sugState.idx=items.length-1;
  const exact = q && allTags().some(t=>t.toLowerCase()===ql);
  const rows=items.map((t,i)=>`<div class="qsug-item${i===sugState.idx?' on':''}" data-sug="${esc(t)}">${highlightMatch(t,q)}</div>`).join('');
  const newHint = (q && !exact) ? `<div class="qsug-new">⏎ to create <b>${esc(q)}</b></div>` : '';
  if(!rows && !newHint){ box.className='qtag-suggest'; box.innerHTML=''; return; }
  box.className='qtag-suggest open';
  box.innerHTML=(items.length?`<div class="qsug-head">Existing tags</div>`:'')+rows+newHint;
  box.querySelectorAll('.qsug-item').forEach(el=>{
    el.onmousedown=e=>{ e.preventDefault(); addQuickTag(spId, el.dataset.sug); };
  });
  if(keepFocus) inp.focus();
}
async function addQuickTag(id, val){
  const sp=state.spells.find(s=>s.id===id);
  const t=(val||'').trim();
  if(sp && t){ sp.tags=[...new Set([...(sp.tags||[]), t])]; await persist(); }
  state.quickTagId=null; render();
}

function normalizeSpell(s){
  if(!s || typeof s!=='object' || typeof s.name!=='string' || !s.name.trim()) return null;
  let lvl = Number.isInteger(s.level) ? s.level : parseInt(s.level);
  if(!Number.isFinite(lvl)) lvl=0;
  lvl=Math.max(0, Math.min(9, lvl));
  const c = s.comps && typeof s.comps==='object' ? s.comps : {};
  return {
    id: (typeof s.id==='string' && s.id) ? s.id : uid(),
    name: String(s.name),
    level: lvl,
    school: SCHOOLS.includes(s.school) ? s.school : 'Evocation',
    ct: typeof s.ct==='string' ? s.ct : 'Action',
    rn: typeof s.rn==='string' ? s.rn : '',
    du: typeof s.du==='string' ? s.du : '',
    concentration: !!s.concentration,
    ritual: !!s.ritual,
    prepared: !!s.prepared,
    alwaysPrepared: !!s.alwaysPrepared,
    comps: { v:!!c.v, s:!!c.s, m:!!c.m, cost: ['','*','**'].includes(c.cost)? c.cost : '' },
    material: typeof s.material==='string' ? s.material : '',
    rows: Array.isArray(s.rows) ? s.rows.filter(r=>r&&typeof r==='object').map(r=>({k:String(r.k||''), v:String(r.v||'')})) : [],
    desc: typeof s.desc==='string' ? s.desc : '',
    tags: Array.isArray(s.tags) ? s.tags.filter(t=>typeof t==='string') : []
  };
}
function normalizeCharacter(c){
  if(!c || typeof c!=='object') return { id:uid(), name:null, spells:[], preparedCap:null };
  const spells = Array.isArray(c.spells) ? c.spells.map(normalizeSpell).filter(Boolean) : [];
  const name = (typeof c.name==='string' && c.name.trim()) ? c.name.trim() : null;
  let cap = Number.isFinite(c.preparedCap) ? c.preparedCap : parseInt(c.preparedCap);
  if(!Number.isFinite(cap) || cap<0) cap=null;
  return { id: (typeof c.id==='string' && c.id) ? c.id : uid(), name, spells, preparedCap:cap };
}
// Accepts a full library export, a single-character object, or a legacy spell array.
function normalizeLibrary(data){
  if(data && Array.isArray(data.characters)){
    const chars = data.characters.map(normalizeCharacter);
    if(!chars.length) return null;
    chars.forEach((c,i)=>{ if(!c.name) c.name = 'Character '+(i+1); });
    const activeId = (typeof data.activeId==='string' && chars.some(c=>c.id===data.activeId)) ? data.activeId : chars[0].id;
    return { version:1, activeId, characters:chars };
  }
  if(data && Array.isArray(data.spells)){
    const spells = data.spells.map(normalizeSpell).filter(Boolean);
    const nm = (typeof data.name==='string' && data.name.trim()) ? data.name.trim() : 'Imported';
    return { version:1, activeId:null, characters:[ {id:uid(), name:nm, spells} ] };
  }
  if(Array.isArray(data)){
    const spells = data.map(normalizeSpell).filter(Boolean);
    if(!spells.length) return null;
    return { version:1, activeId:null, characters:[ {id:uid(), name:'Imported', spells} ] };
  }
  return null;
}

    <button class="cm-act" id="char-dup">Duplicate current</button>
    <button class="cm-act cm-danger" id="char-delete">Delete current</button>
  </div>`;
}
function wireCharMenu(app){
  const cs=document.getElementById('char-select');
  if(cs) cs.onclick=(e)=>{ e.stopPropagation(); state.charMenuOpen=!state.charMenuOpen; renderList(app); };
  if(state.charMenuOpen){
    document.querySelectorAll('.char-item').forEach(b=>b.onclick=()=>switchCharacter(b.dataset.char));
    document.getElementById('char-new').onclick=()=>{ state.charMenuOpen=false; openNameModal('new'); };
    document.getElementById('char-rename').onclick=()=>{ state.charMenuOpen=false; openNameModal('rename'); };
    document.getElementById('char-dup').onclick=()=>duplicateActive();
    document.getElementById('char-delete').onclick=()=>deleteActive();
  }
}
function globalClose(ev){
  if(!state.charMenuOpen) return;
  const menu=document.getElementById('char-menu');
  const sel=document.getElementById('char-select');
  if(menu && !menu.contains(ev.target) && (!sel || !sel.contains(ev.target))){
    state.charMenuOpen=false;
    if(state.view==='list') renderList(document.getElementById('app'));
  }
}
function openCapModal(){
  document.getElementById('modal-root')?.remove();
  const ac=activeChar();
  const cur = Number.isFinite(ac.preparedCap) ? ac.preparedCap : '';
  const prepCount = state.spells.filter(s=>s.prepared).length;
  const root=document.createElement('div'); root.id='modal-root';
  root.innerHTML = `
    <div class="scrim" id="scrim">
      <div class="modal modal-narrow">
        <h2>Prepared spell limit</h2>
        <p class="io-note">Set how many spells “${esc(ac.name||'this character')}” can prepare. Always-prepared spells don't count toward this. Currently <b>${prepCount}</b> prepared. Leave blank for no limit.</p>
        <div class="field"><label>Prepared limit</label><input type="number" id="cap-input" min="0" step="1" value="${cur}" placeholder="e.g. 7" autocomplete="off"></div>
        <div class="modal-actions">
          <button class="btn" id="cap-clear">No limit</button>
          <div class="right"><button class="btn btn-primary" id="cap-save">Save</button></div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(root);
  const inp=document.getElementById('cap-input'); inp.focus();
  document.getElementById('scrim').onclick=e=>{ if(e.target.id==='scrim') root.remove(); };
  const save=async(clear)=>{
    let v = clear ? null : parseInt(inp.value);
    if(!clear && (!Number.isFinite(v) || v<0)) v=null;
    activeChar().preparedCap = v;
    root.remove(); await persist(); render();
  };
  document.getElementById('cap-save').onclick=()=>save(false);
  document.getElementById('cap-clear').onclick=()=>save(true);
  inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); save(false); } else if(e.key==='Escape'){ root.remove(); } };
}
function openNameModal(mode){
  document.getElementById('modal-root')?.remove();
  const ac=activeChar();
  const cur = mode==='rename' ? (ac.name||'') : '';
  const titles={ first:'Name your first character', new:'New character', rename:'Rename character' };
  const ctas={ first:'Save name', new:'Create character', rename:'Save name' };
  const intro = mode==='first'
    ? `<p class="io-note">Your spellbook is now a character in your grimoire. Give this one a name — you can add more characters and switch between them anytime.</p>`
    : mode==='new' ? `<p class="io-note">Creates a fresh, empty spellbook you can switch to.</p>` : '';
  const root=document.createElement('div'); root.id='modal-root';
  root.innerHTML = `
    <div class="scrim" id="scrim">
      <div class="modal modal-narrow">
        <h2>${titles[mode]}</h2>
        ${intro}
        <div class="field"><label>Character name</label><input type="text" id="name-input" value="${esc(cur)}" placeholder="e.g. Thistlewick the Bold" autocomplete="off" spellcheck="false"></div>
        <div class="modal-actions">
          ${mode==='first' ? '<span></span>' : '<button class="btn" id="name-cancel">Cancel</button>'}
          <div class="right"><button class="btn btn-primary" id="name-save">${ctas[mode]}</button></div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(root);
  const inp=document.getElementById('name-input'); inp.focus();
  const cancel=document.getElementById('name-cancel');
  if(cancel) cancel.onclick=()=>root.remove();
  document.getElementById('scrim').onclick=e=>{ if(e.target.id==='scrim' && mode!=='first') root.remove(); };
  const save=async()=>{
    const nm=inp.value.trim();
    if(mode==='rename'){ root.remove(); if(nm) await renameActive(nm); return; }
    if(mode==='new'){ if(!nm){ inp.style.borderColor='var(--danger)'; inp.focus(); return; } root.remove(); await addCharacter(nm); return; }
    root.remove(); await renameActive(nm || 'My Character');   // first-run
  };
  document.getElementById('name-save').onclick=save;
  inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } else if(e.key==='Escape' && mode!=='first'){ root.remove(); } };
}

load();
</script>
